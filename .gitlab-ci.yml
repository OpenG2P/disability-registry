# disability-registry — build & publish on GitLab.
#
# All versioning/build/publish logic lives centrally in openg2p/packaging@v1;
# this file only declares what THIS repo has.
#
#   images -> registry.gitlab.com/openg2p/registry/disability-registry/<name>
#   chart  -> openg2p/charts Helm registry (shared catalogue)

include:
  - project: 'openg2p/packaging'
    ref: v1
    file: '/ci/gitlab/build-publish.yml'

variables:
  PACKAGING_REF: v1

  IMAGES: |
    [
      {
        "name": "staff-api",
        "dockerfile": "docker/staff-api/Dockerfile"
      },
      {
        "name": "partner-api",
        "dockerfile": "docker/partner-api/Dockerfile"
      },
      {
        "name": "celery",
        "dockerfile": "docker/celery/Dockerfile"
      },
      {
        "name": "db-seed",
        "dockerfile": "docker/db-seed/Dockerfile"
      },
      {
        "name": "sanity-tests",
        "dockerfile": "docker/sanity-tests/Dockerfile"
      }
    ]
  CHART_PATH: helm/openg2p-disability-registry
  CHART_IMAGE_PATHS: '[".registry.staffApi.image.tag",".registry.partnerApi.image.tag",".registry.celeryWorker.image.tag",".registry.celeryBeat.image.tag",".registry.dbSeed.image.tag",".registry.sanity.image.tag"]'
  CHART_INHERIT_QUESTIONS: '{"dependency":"openg2p-registry","alias":"registry"}'
  CHART_GITLAB_PROJECT: openg2p/charts

# Repo-level guards. These need no cluster and no database, so they run on every
# push and fail the pipeline before anything is published — which is the point:
# every one of them catches a mistake whose runtime symptom is silence rather
# than an error.
#
# STAGE: must be one of the stages the included pipeline declares —
# `stages: [version, build, chart, changelog]`. There is no `test` stage. Naming
# one that does not exist is not a per-job error: GitLab rejects the whole
# config, and the pipeline fails INSTANTLY with zero jobs, no YAML error and an
# empty failure_reason, which looks nothing like the mistake it is.
#
# `version` is the first stage, so a guard failure here stops the build and
# chart stages before any image or chart is published.
checks:
  stage: version
  image: python:3.11-slim
  script:
    # test/sanity is deliberately excluded: those tests import the platform
    # sanity harness, which only exists inside the sanity image. They run
    # in-cluster as a Helm post-install Job, not here.
    - pip install --no-cache-dir pytest pyyaml
    - pytest test/ --ignore=test/sanity -v
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_MERGE_REQUEST_IID
