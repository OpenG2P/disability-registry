# Disability Registry — what the reporting generator cannot work out itself.
#
# The mechanical part of the reporting layer is generated by the platform's
# generate_reporting_views.py: one view per entity node, geography inherited from
# the parent, workflow columns carried, personal data withheld. This file holds
# only the decisions that are ours to make.

prefix: dr_rpt_

# The entity tree — DECLARED, not discovered.
#
# Discovery reads the data, and a production registry is installed EMPTY: the
# country loads its register afterwards. On that install nothing resolves and
# every view loses its geography while still existing, which reads as working.
#
# This registry's tree is a single star: everything hangs off the person. There
# is no group register, so nothing here has a two-level parent chain.
tree:
  person_with_disability: null
  disability_detail:      {parent: person_with_disability}
  human_assistance:       {parent: person_with_disability}
  assistive_technology:   {parent: person_with_disability}
  medical_care:           {parent: person_with_disability}
  housing_support:        {parent: person_with_disability}
  animal_assistance:      {parent: person_with_disability}
  related_person:         {parent: person_with_disability}
  program_enrolment:      {parent: person_with_disability}
  score:                  {parent: person_with_disability}
  score_history:          null

# Hand-written, and left alone by the generator.
#
# `person` is SEMANTIC: it derives the age bands, the expiry/overdue flags and
# the coverage-gap flag that every dashboard groups by, and materializes them.
#
# `support_need` is the one view the generator could not produce at all — it is a
# UNION across five sibling sub-registers, and the generator's model is one view
# per entity. Unmet need is a question about all five at once; leaving it to be
# assembled per chart is how five charts end up with five definitions of "unmet".
custom:
  - person
  - support_need

pii:
  # Nothing added. Names, identifiers and certificate numbers stay withheld by
  # the classifier's defaults, and that is the right call here rather than a
  # nuisance: disability status is special-category data in most jurisdictions,
  # and these views feed a Superset instance and a shared maps surface whose
  # audiences are wider than the registry's own caseworkers.
  #
  # `program_name` is NOT allowed through here, unlike in the social registry.
  # Paired with a person-level disability attribute it becomes an indirect
  # identifier in a thin geography — and the programme aggregates that matter are
  # already in dr_rpt_person.programmes.
  allow: []

# The person's own attributes, carried down onto each child row.
#
# "Unmet need by sex", "assistive technology by age band" are questions about the
# CHILD row, and without these every chart asking one has to remember to join
# back to dr_rpt_person.
#
# age_band comes from the person view rather than being redefined here: two
# definitions of where 25 falls is how two charts come to disagree.
inherit:
  disability_detail:
    person_with_disability: [gender, is_female, age_band, disability_status_level]
  human_assistance:
    person_with_disability: [gender, is_female, age_band, disability_status_level]
  assistive_technology:
    person_with_disability: [gender, is_female, age_band, disability_status_level]
  medical_care:
    person_with_disability: [gender, is_female, age_band, disability_status_level]
  housing_support:
    person_with_disability: [gender, is_female, age_band, disability_status_level]
  animal_assistance:
    person_with_disability: [gender, is_female, age_band, disability_status_level]
  related_person:
    person_with_disability: [gender, is_female, age_band]
  program_enrolment:
    person_with_disability: [gender, is_female, age_band, disability_status_level]

# Materialized, with the columns their charts group by.
#
# disability_detail is the large one — every registrant has at least one row and
# many have several — and it joins the person view on every read.
#
# The refresh CronJob picks these up automatically: it matches on the dr_rpt_
# prefix and resolves order from pg_depend, so nothing here needs listing twice.
# That ordering matters here more than usual: dr_rpt_support_need SELECTs from
# dr_rpt_person, so a refresh that ran them in the wrong order would rebuild the
# union against stale person attributes.
materialized:
  disability_detail:
    indexes:
      - [impairment_type]
      - [geo_1, geo_2, geo_3]
  program_enrolment:
    indexes:
      - [program_name]
      - [geo_1, geo_2, geo_3]
